receivers:

  # Receive telemetry from applications
  otlp:
    protocols:
      grpc:
      http:


  # Collect host level metrics like CPU and memory
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      network:
      load:

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  newrelic:
    api_key: ${NEW_RELIC_API_KEY}

service:
  pipelines:

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [newrelic]

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [newrelic]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [newrelic]