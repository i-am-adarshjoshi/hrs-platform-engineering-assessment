receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:

exporters:
  newrelic:
    api_key: ${NEW_RELIC_API_KEY}

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [newrelic]

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [newrelic]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [newrelic]